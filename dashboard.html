<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="飞跃未来少儿学院用户中心。">
  <title>用户中心 - 飞跃未来少儿学院</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <header class="site-header scrolled">
    <div class="container nav-container">
      <a href="index.html" class="brand-logo">
        <img src="images/logo.svg" alt="飞跃未来少儿学院 Sunbridge" class="light-logo">
        <img src="images/logo-white.svg" alt="飞跃未来少儿学院 Sunbridge" class="dark-logo">
      </a>
      <a href="index.html" class="btn btn-outline">返回首页</a>
    </div>
  </header>

  <main class="auth-page">
    <div class="dashboard-shell">
      <p id="dashboard-loading">正在载入用户资料…</p>
      <div id="dashboard-content" hidden>
        <div id="dashboard-status" class="auth-status" role="status" aria-live="polite" hidden></div>

        <div class="dashboard-header">
          <div>
            <p class="section-tag">用户中心</p>
            <h1>你好，<span id="welcome-name"></span><span id="profile-role" class="role-badge"></span></h1>
          </div>
          <button id="logout-button" class="btn btn-outline" type="button">退出登录</button>
        </div>

        <div class="dashboard-grid">
          <section class="dashboard-panel">
            <h2>个人资料</h2>
            <form id="profile-form">
              <div class="form-group">
                <label class="form-label" for="profile-email">电子邮箱</label>
                <input class="form-control" id="profile-email" type="email" disabled>
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-name">姓名</label>
                <input class="form-control" id="profile-name" name="full_name" type="text" autocomplete="name" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="profile-phone">联系电话</label>
                <input class="form-control" id="profile-phone" name="phone" type="tel" autocomplete="tel">
              </div>
              <button class="btn btn-primary" type="submit">保存资料</button>
            </form>
          </section>

          <section class="dashboard-panel">
            <h2>修改密码</h2>
            <form id="password-form">
              <div class="form-group">
                <label class="form-label" for="new-password">新密码</label>
                <input class="form-control" id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="new-password-confirmation">确认新密码</label>
                <input class="form-control" id="new-password-confirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="8" required>
              </div>
              <button class="btn btn-tech" type="submit">更新密码</button>
            </form>
          </section>

          <section id="admin-panel" class="dashboard-panel admin-panel" hidden>
            <h2>用户与角色管理</h2>
            <p style="color:var(--text-muted);margin-bottom:18px">管理员可以查看用户资料并调整权限。当前管理员不能修改自己的角色。</p>
            <table class="user-table">
              <thead>
                <tr>
                  <th>用户</th>
                  <th>电话</th>
                  <th>角色</th>
                  <th>注册日期</th>
                </tr>
              </thead>
              <tbody id="user-rows"></tbody>
            </table>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
